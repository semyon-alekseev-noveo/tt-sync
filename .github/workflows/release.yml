name: Release Obsidian plugin

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag (defaults to manifest.json version, e.g. 2.0.15)
        required: false
      prerelease:
        description: Mark as pre-release
        type: boolean
        default: true
  push:
    tags:
      - "v*"
      - "[0-9]+.[0-9]+.[0-9]*"

permissions:
  contents: write

env:
  PLUGIN_ID: tickticksync-abyss

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve release version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version }}"
            if [ -z "$TAG" ]; then
              TAG=$(jq -r .version manifest.json)
            fi
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build plugin assets
        run: |
          npm ci
          npm run build
          jq --arg v "${{ steps.version.outputs.tag }}" '.version = $v' dist/manifest.json > dist/manifest.json.tmp
          mv dist/manifest.json.tmp dist/manifest.json
          mkdir -p "${{ env.PLUGIN_ID }}"
          cp dist/main.js dist/manifest.json dist/styles.css "${{ env.PLUGIN_ID }}/"
          zip -r "${{ env.PLUGIN_ID }}.zip" "${{ env.PLUGIN_ID }}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            ${{ env.PLUGIN_ID }}.zip
            dist/main.js
            dist/manifest.json
            dist/styles.css
